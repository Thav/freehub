services:
  legacy:
    profiles: [legacy]
    build:
      context: .legacy-build/reference
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    environment:
      LEGACY_DB_HOST: db
      LEGACY_DB_NAME: freehub_legacy
      LEGACY_DB_USER: freehub
      LEGACY_DB_PASSWORD: freehub
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [legacy, ingress]

  db:
    profiles: [legacy]
    image: mariadb@sha256:345fa26d595e8c7fe298e0c4098ed400356f502458769c8902229b3437d6da2b
    environment:
      MARIADB_DATABASE: freehub_legacy
      MARIADB_USER: freehub
      MARIADB_PASSWORD: freehub
      MARIADB_ROOT_PASSWORD: local-only-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [legacy]

  legacy-capture:
    profiles: [capture]
    build:
      context: test/legacy-visual
    environment:
      BASE_URL: http://legacy:3000
      HOME: /tmp
    user: "${CAPTURE_UID:-1000}:${CAPTURE_GID:-1000}"
    working_dir: /work
    volumes:
      - .:/work
    networks: [ingress]

  migration-db:
    profiles: [migration]
    image: mariadb@sha256:345fa26d595e8c7fe298e0c4098ed400356f502458769c8902229b3437d6da2b
    environment:
      MARIADB_DATABASE: freehub_preflight
      MARIADB_USER: freehub
      MARIADB_PASSWORD: freehub
      MARIADB_ROOT_PASSWORD: local-only-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [migration]

  modern-db:
    profiles: [modern]
    image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_DB: freehub_modern
      POSTGRES_USER: freehub
      POSTGRES_PASSWORD: freehub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freehub -d freehub_modern"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [modern]

  modern:
    profiles: [modern]
    build:
      context: modern
      target: runtime
    environment:
      DATABASE_URL: postgresql://freehub:freehub@modern-db:5432/freehub_modern?schema=public
      PORT: 3001
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist-server/server.js"]
    depends_on:
      modern-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/up').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [modern, ingress]

  modern-test:
    profiles: [test]
    build:
      context: modern
      target: test
    environment:
      DATABASE_URL: postgresql://freehub:freehub@modern-db:5432/freehub_modern?schema=public
      XDG_CACHE_HOME: /tmp/prisma-cache
    depends_on:
      modern-db:
        condition: service_healthy
    networks: [modern]

  modern-visual:
    profiles: [visual]
    image: mcr.microsoft.com/playwright@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    environment:
      BASE_URL: http://modern:3001
      HOME: /tmp
    working_dir: /work
    volumes:
      - ./modern:/work:ro
    command: ["npx", "playwright", "test"]
    networks: [ingress]

networks:
  legacy:
    internal: true
  ingress: {}
  migration:
    internal: true
  modern:
    internal: true
