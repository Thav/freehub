services:
  database:
    image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freehub}
      POSTGRES_USER: ${POSTGRES_USER:-freehub}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [database]

  release:
    profiles: [release]
    image: ${FREEHUB_IMAGE:?set FREEHUB_IMAGE to an immutable image reference}
    command: ["npm", "run", "release"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [database]

  app:
    image: ${FREEHUB_IMAGE:?set FREEHUB_IMAGE to an immutable image reference}
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PORT: ${FREEHUB_CONTAINER_PORT:-3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    secrets: [database_url]
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${FREEHUB_HTTP_PORT:-3001}:${FREEHUB_CONTAINER_PORT:-3001}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:$${process.env.PORT}/up`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [database, ingress]

  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      FREEHUB_DOMAIN: ${FREEHUB_DOMAIN:?set FREEHUB_DOMAIN to the public hostname}
      FREEHUB_CONTAINER_PORT: ${FREEHUB_CONTAINER_PORT:-3001}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${FREEHUB_PUBLIC_HTTP_PORT:-80}:80"
      - "${FREEHUB_PUBLIC_HTTPS_PORT:-443}:443"
      - "${FREEHUB_PUBLIC_HTTPS_PORT:-443}:443/udp"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [ingress]

  admin:
    profiles: [ops]
    image: ${FREEHUB_IMAGE:?set FREEHUB_IMAGE to an immutable image reference}
    entrypoint: ["./bin/container-entrypoint", "node", "dist-server/ops/admin.js"]
    command: ["users", "list"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [database]

volumes:
  database-data:
  caddy-data:
  caddy-config:

networks:
  database:
    internal: true
  ingress: {}

secrets:
  database_password:
    file: ${FREEHUB_SECRETS_DIR:-./secrets}/database_password
  database_url:
    file: ${FREEHUB_SECRETS_DIR:-./secrets}/database_url
